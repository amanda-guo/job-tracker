name: CI

on:
  pull_request:
  push:
    branches: [main]
 
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
 
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
 
      - run: npm ci
 
      - name: Typecheck, lint and test
        run: npm run check
 
      - name: Build
        run: npm run build