name: Claude background agent

on:
  issues:
    types: [labeled]

jobs:
  claude:
    if: github.event.label.name == 'claude'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: "claude"
          claude_args: |
            --max-turns 30
            --allowedTools "Bash(npm run check),Bash(npm run test),Bash(npm run lint),Bash(npm run typecheck)"
